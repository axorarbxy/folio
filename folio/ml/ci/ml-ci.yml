name: Folio ML Engine CI

on:
  push:
    branches: [master, main]
    paths:
      - 'ml/**'
      - '.github/workflows/ml-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'ml/**'

jobs:
  test-and-eval:
    name: Lint, Test & Smoke Eval (Fake Mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Unit Tests
        run: |
          PYTHONPATH=src pytest -q

      - name: Run Smoke Evaluation in Fake Mode
        run: |
          PYTHONPATH=src python -m folio_ml.eval run --suite all --mode fake

      - name: Verify Regression Gate
        run: |
          PYTHONPATH=src python -m folio_ml.eval.regression_gate
