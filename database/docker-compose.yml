services:
  postgres:
    image: postgres:16-alpine
    container_name: folio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-folio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - folio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-folio}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  folio_pgdata:
    name: folio_pgdata
